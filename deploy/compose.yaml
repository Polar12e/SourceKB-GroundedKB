name: groundedkb

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundedkb}
      POSTGRES_USER: ${POSTGRES_USER:-groundedkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundedkb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-groundedkb} -d $${POSTGRES_DB:-groundedkb}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  retrieval:
    build:
      context: ..
      dockerfile: workers/retrieval/Dockerfile
    environment:
      RETRIEVAL_PORT: "8081"
      RETRIEVAL_CORPUS: /data/private/corpus/pages.jsonl
      RETRIEVAL_MANIFEST: /data/manifests/documents.json
    volumes:
      - ../data:/data:ro
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: gateway
    environment:
      GATEWAY_PORT: "8080"
      RETRIEVAL_URL: http://retrieval:8081
      AGENT_URL: http://agent:8083
    ports:
      - "8080:8080"
    depends_on:
      agent:
        condition: service_healthy
      retrieval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ingest:
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: ingest
    environment:
      INGEST_PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: agent
    environment:
      AGENT_PORT: "8083"
      RETRIEVAL_URL: http://retrieval:8081
    ports:
      - "8083:8083"
    depends_on:
      retrieval:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: model-gateway
    environment:
      MODEL_GATEWAY_PORT: "8084"
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY_ENV: ${LLM_API_KEY_ENV:-DEEPSEEK_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
